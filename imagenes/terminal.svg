<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#termBg)"/>

  <!-- Ventana de terminal -->
  <rect x="40" y="60" width="320" height="240" rx="10" fill="#0d1411" stroke="#39d38a" stroke-width="2"/>
  <rect x="40" y="60" width="320" height="28" rx="10" fill="#132019"/>
  <circle cx="58" cy="74" r="5" fill="#39d38a"/>
  <circle cx="76" cy="74" r="5" fill="#2a6b4c"/>
  <circle cx="94" cy="74" r="5" fill="#2a6b4c"/>

  <!-- Texto tipo código en la terminal -->
  <text x="56" y="120" font-family="monospace" font-size="14" fill="#6ce7b3">$ whoami</text>
  <text x="56" y="145" font-family="monospace" font-size="14" fill="#39d38a">elliot</text>
  <text x="56" y="170" font-family="monospace" font-size="14" fill="#6ce7b3">$ connect --fsociety</text>
  <text x="56" y="195" font-family="monospace" font-size="14" fill="#39d38a">access_granted...</text>
  <text x="56" y="220" font-family="monospace" font-size="14" fill="#6ce7b3">$ run analisis.sh</text>
  <text x="56" y="245" font-family="monospace" font-size="14" fill="#39d38a">01001000 01100001</text>
  <rect x="56" y="258" width="10" height="16" fill="#6ce7b3">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Silueta encapuchada abstracta, sin rasgos identificables -->
  <path d="M200 320 C 170 300, 165 340, 150 360 L 250 360 C 235 340, 230 300, 200 320 Z" fill="#101d17" opacity="0.9"/>
</svg>
