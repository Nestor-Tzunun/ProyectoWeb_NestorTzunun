<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2220"/>
      <stop offset="100%" stop-color="#0d1111"/>
    </linearGradient>
    <linearGradient id="fruitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8be6c4"/>
      <stop offset="100%" stop-color="#4ca787"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>

  <!-- Forma abstracta inspirada en una manzana mordida, sin ser un logotipo real -->
  <path d="M200 120
           C 150 100, 100 140, 100 210
           C 100 280, 150 320, 200 320
           C 250 320, 300 280, 300 210
           C 300 150, 260 110, 220 118
           C 214 100, 226 90, 240 90"
        fill="url(#fruitGrad)" stroke="#e9fff3" stroke-width="3"/>

  <!-- Mordida -->
  <circle cx="255" cy="200" r="34" fill="url(#bgGrad)"/>

  <!-- Hoja -->
  <path d="M205 118 C 205 95, 230 85, 250 92 C 240 112, 220 118, 205 118 Z"
        fill="#6ce7b3" stroke="#e9fff3" stroke-width="2"/>

  <!-- Chispa de idea -->
  <path d="M200 40 L210 70 L240 75 L214 92 L222 122 L200 105 L178 122 L186 92 L160 75 L190 70 Z"
        fill="#e9fff3" opacity="0.9"/>

  <!-- Líneas de circuito decorativas -->
  <g stroke="#4ca787" stroke-width="2" fill="none" opacity="0.6">
    <path d="M40 340 h60 v-40 h40"/>
    <path d="M360 60 h-50 v50 h-30"/>
    <circle cx="100" cy="300" r="4" fill="#6ce7b3"/>
    <circle cx="280" cy="110" r="4" fill="#6ce7b3"/>
  </g>
</svg>
